<div class="detail-page">
  <a mat-button routerLink="/subjects">
    <mat-icon>arrow_back</mat-icon> Back to Subjects
  </a>

  @if (store.currentDetail(); as d) {
    <mat-card class="detail-card">
      <mat-card-header>
        <mat-card-title>{{ d.title }}</mat-card-title>
        <mat-card-subtitle>{{ d.wordCount }} words</mat-card-subtitle>
      </mat-card-header>
      <mat-card-content>
        <div class="markdown-body" appMermaid [innerHTML]="renderedBody()"></div>
        <!-- <markdown [data]="renderedBody()" mermaid></markdown> -->
      </mat-card-content>
    </mat-card>
  } @else {
    <div class="loading">
      <mat-spinner diameter="48"></mat-spinner>
    </div>
  }
</div>
